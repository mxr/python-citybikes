[project]
name = "python-citybikes"
dynamic = ["version"]
description = "Client interface for the Citybikes API"
readme = "README.rst"
requires-python = ">=3.9"
dependencies = [
    "aiohttp",
    "requests",
]
license = "MIT"
license-files = ["LICENSE.txt"]

keywords = [
    "Citybikes",
    "api.citybik.es",
    "bike sharing",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://citybik.es"
Documentation = "https://docs.citybik.es"
Source = "https://github.com/eskerda/python-citybikes"
Tracker = "https://github.com/eskerda/python-citybikes/issues"

[dependency-groups]
dev = [
    "mypy",
    "pytest-asyncio",
    "pytest",
    "responses",
    "pytest-aiohttp",
    "types-requests",
]

[tool.setuptools.package-data]
citybikes = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "citybikes.__version__"}

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = "tests.*"
